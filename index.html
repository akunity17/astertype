<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astertype Studio</title>
</head>
<body>

<div id="preloader">
  <header class="topbar">
    <div class="logo">ASTERTYPE<br>STUDIO</div>
  </header>

  <div class="scene">
    <div class="tilt">
      <div class="extrude">
        <img src="loader.svg" alt="icon">
      </div>
    </div>
  </div>

  <div class="content">
    <h1>[STAY<br>TUNED]</h1>
    <p class="subtitle">What's worth making <br>takes time</p>
    <a href="https://www.instagram.com/andre_marques._" class="ig-btn">Follow me on instagram</a>
  </div>
</div>

<style>
@font-face {
  font-family: 'Switzer';
  src: url('Switzer-BoldItalic.woff') format('woff');
  font-weight: 700;
  font-style: italic;
  font-display: swap;
}

@font-face {
  font-family: 'Switzer';
  src: url('Switzer-Semibold.woff') format('woff');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

* {
  box-sizing: border-box;
}

#preloader {
  position: fixed;
  inset: 0;
  background: #040509;
  transition: opacity 0.8s ease;
  font-family: 'Switzer', sans-serif;
  overflow: hidden;
}

/* logo — igual em mobile e desktop */
.topbar {
  position: absolute;
  top: 15px;
  left: 30px;
}

.logo {
  font-weight: 500;
  font-style: italic;
  color: #E5E5E5;
  font-size: 1.1rem;
  line-height: 0.9;
  text-transform: uppercase;
}

/* loader — tamanho fixo, sempre centrado no ecra */
.scene {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-55%, -70%);
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
  transform-style: preserve-3d;
}

.tilt {
  transform: rotateX(44deg) rotateY(31deg) rotateZ(-16deg) translateX(20px);
  transform-style: preserve-3d;
}

.extrude {
  position: relative;
  width: 8rem;
  aspect-ratio: 1 / 1;
  transform-style: preserve-3d;
  animation: spin 2.5s cubic-bezier(0.66, 0, 0.34, 1) infinite;
}

.extrude img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

@keyframes spin {
  from { transform: rotateZ(0deg); }
  to   { transform: rotateZ(360deg); }
}

/* texto — mesmas cores/estilo em mobile e desktop */
.content {
  position: absolute;
  left: 30px;
  right: 30px;
  bottom: 30px;
}

h1 {
  font-weight: 800;
  color: #E5E5E5;
  font-size: clamp(2.2rem, 14vw, 3rem);
  line-height: 1;
  text-transform: uppercase;
  margin: 0 0 2rem;
}

.subtitle {
  font-weight: 600;
  color: #868687;
  font-size: 1.5rem;
  line-height: 1;
  margin: 0 0 1.25rem;
}

.ig-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 40px;
  width: 100%;
  background: #313131;
  color: #9E9E9E;
  font-weight: 600;
  font-size: 1rem;
  padding: 0 1rem;
  border-radius: 8px;
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.63, 0, 0.36, 1);
}

.ig-btn:hover {
  background: #E5E5E5;
  color: #313131;
}

/* desktop — so ajusta espacamento e larguras, nao cores/design */
@media (min-width: 900px) {
  .topbar {
    top: 20px;
    left: 40px;
  }

  .content {
    left: 40px;
    right: auto;
    bottom: 60px;
    max-width: 420px;
  }

  .ig-btn {
    width: auto;
    padding: 0 2rem;
  }

  .scene {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
}

</style>

</body>
</html>
